# Release validation + GitHub Release + crates.io.
#
# Validation (fmt, clippy, test, smoke) runs on:
#   - PRs into main
#   - pushes to release/**
#   - tags v*
#   - workflow_dispatch (checks only; does not publish)
#
# Push to main is not a trigger: the PR into main already ran this workflow.
# Publish (GitHub Release + crates.io) runs only on tags v*.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Re-run the same gate as CI so a tag cannot skip checks.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --quiet
      - run: ./tests/smoke.sh

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Independent of github-release so a crates.io failure cannot block the
  # GitHub Release page. 
  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches crate version
        run: |
          set -euo pipefail
          crate=$(awk '
            $0 ~ /^\[package\]/ { in_pkg=1; next }
            in_pkg && $0 ~ /^\[/ { in_pkg=0 }
            in_pkg && $0 ~ /^version/ {
              if (match($0, /"[^"]+"/)) {
                print substr($0, RSTART+1, RLENGTH-2)
                exit
              }
            }
          ' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "${crate}" ]]; then
            echo "::error::Could not read [package] version from Cargo.toml"
            exit 1
          fi
          if [[ "${tag}" != "${crate}" ]]; then
            echo "::error::Tag v${tag} does not match Cargo.toml version ${crate}"
            exit 1
          fi
      - name: Publish symkit
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
