# Release validation + GitHub Release + crates.io (see DEVELOPMENT.md).
#
# Branch model (same family path as SymWorx / SymSight):
#   develop → stage → release/vX.Y.Z → main → manual tag vX.Y.Z
#
# Validation (meta, fmt, clippy, test, smoke) runs on:
#   - PRs into main
#   - pushes to release/**
#   - tags v*
#   - workflow_dispatch (checks only; does not publish)
#
# Push to main is not a trigger: the PR into main already ran this workflow.
#
# Publish (GitHub Release + crates.io) runs only on tags v*, after
# validation succeeds. Create tags manually after merging release/* → main.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  # Re-run validation on a branch without publishing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Metadata: version / changelog / branch conventions for the release path
  # ---------------------------------------------------------------------------
  release-meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION=$(
            awk '
              $0 ~ /^\[package\]/ { in_pkg=1; next }
              in_pkg && $0 ~ /^\[/ { in_pkg=0 }
              in_pkg && $0 ~ /^version/ {
                if (match($0, /"[^"]+"/)) {
                  print substr($0, RSTART+1, RLENGTH-2)
                  exit
                }
              }
            ' Cargo.toml
          )
          if [[ -z "${PKG_VERSION}" ]]; then
            echo "::error::Could not read [package] version from Cargo.toml"
            exit 1
          fi
          echo "package_version=${PKG_VERSION}"

          IS_TAG=false
          IS_PRERELEASE=false
          TAG_VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_TAG=true
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" == *-* ]]; then
              IS_PRERELEASE=true
            fi
          fi

          # release/vX.Y.Z branch naming (push or PR head)
          BRANCH_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "${BRANCH_REF}" == release/* ]]; then
            BRANCH_VERSION="${BRANCH_REF#release/}"
            BRANCH_VERSION="${BRANCH_VERSION#v}"
            if [[ "${BRANCH_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::release branch '${BRANCH_REF}' version (${BRANCH_VERSION}) does not match Cargo.toml package version (${PKG_VERSION})"
              exit 1
            fi
          fi

          if [[ "${IS_TAG}" == "true" ]]; then
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::Tag v${TAG_VERSION} does not match Cargo.toml package version ${PKG_VERSION}"
              exit 1
            fi
            # Final releases should land on main; pre-releases may come from stage.
            if [[ "${IS_PRERELEASE}" != "true" ]]; then
              git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                if git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
                  echo "Tag commit is on main (or an ancestor of main)."
                else
                  echo "::warning::Tag v${TAG_VERSION} is not an ancestor of main. Final releases should be cut after merging release/* → main."
                fi
              else
                echo "::warning::Branch 'main' does not exist yet; skipping main-ancestor check for tag v${TAG_VERSION}."
              fi
            fi
          fi

          # CHANGELOG: require a heading for this version (final and pre-release tags,
          # and release/* branches). Keep Unreleased PRs to main flexible.
          if [[ "${IS_TAG}" == "true" || "${BRANCH_REF}" == release/* ]]; then
            if ! grep -Eq "^## \[${PKG_VERSION}\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md missing '## [${PKG_VERSION}]' section for this release"
              exit 1
            fi
          fi

          {
            echo "version=${PKG_VERSION}"
            echo "is_tag=${IS_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release metadata: version=${PKG_VERSION} is_tag=${IS_TAG} is_prerelease=${IS_PRERELEASE}"
          if [[ "${IS_TAG}" == "true" ]]; then
            echo "Tag push: publish jobs will run after validation succeeds."
          else
            echo "Branch/PR: validation only (publish runs on tags v* only)."
          fi

  # Re-run the same gate as CI so a tag cannot skip checks.
  check:
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --quiet
      - run: ./tests/smoke.sh

  # Aggregate gate used by branch protection / required checks
  release-ready:
    name: Release checks passed
    runs-on: ubuntu-latest
    needs: [release-meta, check]
    if: always()
    steps:
      - name: Require all validation jobs
        run: |
          set -euo pipefail
          echo "release-meta: ${{ needs.release-meta.result }}"
          echo "check: ${{ needs.check.result }}"
          test "${{ needs.release-meta.result }}" = "success"
          test "${{ needs.check.result }}" = "success"
          echo "All release validation jobs passed for v${{ needs.release-meta.outputs.version }}"
          echo "On tag pushes: github-release + publish-crates run next."

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [release-meta, release-ready]
    if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-meta.outputs.version }}
          name: v${{ needs.release-meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.release-meta.outputs.is_prerelease == 'true' }}

  # Independent of github-release so a crates.io failure cannot block the
  # GitHub Release page.
  publish-crates:
    name: Publish crates.io
    runs-on: ubuntu-latest
    needs: [release-meta, release-ready]
    if: needs.release-meta.outputs.is_tag == 'true' && needs.release-ready.result == 'success'
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish symkit
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
