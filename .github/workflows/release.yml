# Release validation + GitHub Release (same trigger matrix as SymWorx / symsight).
#
# Branch model:
#   develop → stage → release/vX.Y.Z → main → manual tag vX.Y.Z
#
# Validation (fmt, clippy, test, smoke) runs on:
#   - PRs into main
#   - pushes to release/**
#   - tags v*
#   - workflow_dispatch (checks only; does not publish)
#
# Push to main is not a trigger: the PR into main already ran this workflow.
#
# Publish (GitHub Release only; no crates.io) runs only on tags v*.

name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Re-run the same gate as CI so a tag cannot skip checks.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --quiet
      - run: ./tests/smoke.sh

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
